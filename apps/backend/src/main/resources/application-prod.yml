spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:10000}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}

management:
  endpoint:
    health:
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      refresh-cookie-name: ${APP_SECURITY_JWT_REFRESH_COOKIE_NAME:platform_refresh_token}
      refresh-cookie-path: ${APP_SECURITY_JWT_REFRESH_COOKIE_PATH:/api/v1/auth}
      refresh-cookie-same-site: ${APP_SECURITY_JWT_REFRESH_COOKIE_SAME_SITE:Strict}
      refresh-cookie-secure: ${APP_SECURITY_JWT_REFRESH_COOKIE_SECURE:true}
    public-endpoints:
      docs-enabled: ${APP_SECURITY_PUBLIC_DOCS_ENABLED:false}
      observability-enabled: ${APP_SECURITY_PUBLIC_OBSERVABILITY_ENABLED:false}
    password-reset:
      token-expiry-minutes: ${APP_PASSWORD_RESET_EXPIRY_MINUTES:30}
      reset-url-base: ${APP_PASSWORD_RESET_URL_BASE}
  demo:
    assisted:
      enabled: ${APP_DEMO_ASSISTED_ENABLED:false}
      tenant-code: ${APP_DEMO_ASSISTED_TENANT_CODE:}
      user-email: ${APP_DEMO_ASSISTED_USER_EMAIL:}
      user-password: ${APP_DEMO_ASSISTED_USER_PASSWORD:}
      feature-flag-key: ${APP_DEMO_ASSISTED_FEATURE_FLAG_KEY:demo.assisted.enabled}
      enforce-feature-flag: ${APP_DEMO_ASSISTED_ENFORCE_FEATURE_FLAG:true}
  bootstrap:
    master-admin:
      enabled: ${APP_BOOTSTRAP_MASTER_ADMIN_ENABLED:false}
      tenant-code: ${APP_BOOTSTRAP_MASTER_ADMIN_TENANT_CODE:PHAIFFER_TECH}
      tenant-name: ${APP_BOOTSTRAP_MASTER_ADMIN_TENANT_NAME:Willian Phaiffer Cardoso Desenvolvimento de Software LTDA}
      user-email: ${APP_BOOTSTRAP_MASTER_ADMIN_EMAIL:sysadmin@phaiffer.tech}
      user-password: ${APP_BOOTSTRAP_MASTER_ADMIN_PASSWORD:}
      full-name: ${APP_BOOTSTRAP_MASTER_ADMIN_FULL_NAME:System Administrator}
  notification:
    mail:
      from-address: ${APP_NOTIFICATION_MAIL_FROM_ADDRESS}
      from-name: ${APP_NOTIFICATION_MAIL_FROM_NAME:PhaifferTech Platform}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

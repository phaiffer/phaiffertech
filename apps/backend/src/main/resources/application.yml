spring:
  application:
    name: platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/platform_db}
    username: ${SPRING_DATASOURCE_USERNAME:platform_user}
    password: ${SPRING_DATASOURCE_PASSWORD:platform_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      service: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  tenant:
    header-name: ${APP_TENANT_HEADER:X-Tenant-Id}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:ZmFrZV9qd3Rfc2VjcmV0X2Zvcl9kZXZlbG9wbWVudF9vbmx5XzEyMzQ1}
      access-minutes: ${APP_SECURITY_JWT_ACCESS_MINUTES:15}
      refresh-days: ${APP_SECURITY_JWT_REFRESH_DAYS:7}
      issuer: ${APP_SECURITY_JWT_ISSUER:platform-api}
      refresh-cookie-name: ${APP_SECURITY_JWT_REFRESH_COOKIE_NAME:platform_refresh_token}
      refresh-cookie-path: ${APP_SECURITY_JWT_REFRESH_COOKIE_PATH:/api/v1/auth}
      refresh-cookie-same-site: ${APP_SECURITY_JWT_REFRESH_COOKIE_SAME_SITE:Lax}
      refresh-cookie-secure: ${APP_SECURITY_JWT_REFRESH_COOKIE_SECURE:false}
    public-endpoints:
      docs-enabled: ${APP_SECURITY_PUBLIC_DOCS_ENABLED:true}
      observability-enabled: ${APP_SECURITY_PUBLIC_OBSERVABILITY_ENABLED:true}
    bruteforce:
      enabled: ${APP_SECURITY_BRUTEFORCE_ENABLED:true}
      max-attempts: ${APP_SECURITY_BRUTEFORCE_MAX_ATTEMPTS:5}
      lock-minutes: ${APP_SECURITY_BRUTEFORCE_LOCK_MINUTES:15}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
    api-per-minute: ${APP_RATE_LIMIT_API_PER_MINUTE:100}
    telemetry-per-minute: ${APP_RATE_LIMIT_TELEMETRY_PER_MINUTE:500}
  demo:
    assisted:
      enabled: ${APP_DEMO_ASSISTED_ENABLED:false}
      tenant-code: ${APP_DEMO_ASSISTED_TENANT_CODE:}
      user-email: ${APP_DEMO_ASSISTED_USER_EMAIL:}
      user-password: ${APP_DEMO_ASSISTED_USER_PASSWORD:}
      feature-flag-key: ${APP_DEMO_ASSISTED_FEATURE_FLAG_KEY:demo.assisted.enabled}
      enforce-feature-flag: ${APP_DEMO_ASSISTED_ENFORCE_FEATURE_FLAG:false}
    commercial:
      enabled: ${APP_DEMO_COMMERCIAL_ENABLED:false}
      tenant-code: ${APP_DEMO_COMMERCIAL_TENANT_CODE:phaiffertech-demo}
      tenant-name: ${APP_DEMO_COMMERCIAL_TENANT_NAME:PhaifferTech Demo}
      user-email: ${APP_DEMO_COMMERCIAL_USER_EMAIL:}
      user-password: ${APP_DEMO_COMMERCIAL_USER_PASSWORD:}
      user-full-name: ${APP_DEMO_COMMERCIAL_USER_FULL_NAME:PhaifferTech Demo Operator}
  bootstrap:
    master-admin:
      enabled: ${APP_BOOTSTRAP_MASTER_ADMIN_ENABLED:false}
      tenant-code: ${APP_BOOTSTRAP_MASTER_ADMIN_TENANT_CODE:PHAIFFER_TECH}
      tenant-name: ${APP_BOOTSTRAP_MASTER_ADMIN_TENANT_NAME:Willian Phaiffer Cardoso Desenvolvimento de Software LTDA}
      user-email: ${APP_BOOTSTRAP_MASTER_ADMIN_EMAIL:sysadmin@phaiffer.tech}
      user-password: ${APP_BOOTSTRAP_MASTER_ADMIN_PASSWORD:}
      full-name: ${APP_BOOTSTRAP_MASTER_ADMIN_FULL_NAME:System Administrator}

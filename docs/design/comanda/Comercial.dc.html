</helmet>

        <div role="tablist" aria-label="Seção" style="display: inline-flex; gap: 4px; padding: 4px; background: #E3E6ED; border-radius: 12px; width: max-content">

      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; min-width: 1060px">
        <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
          <div style="background: #E3E6ED; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 2px">
              <span style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 15px; font-weight: 700">{{s.name}}</h2><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">{{s.count}}</span></span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #2B3150">{{s.total}}</span>
            </div>
            <sc-for list="{{s.cards}}" as="c" hint-placeholder-count="2">
              <a href="Lead.dc.html" style="{{c.style}}">
                <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="{{c.srcStyle}}">{{c.source}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #4A5170">{{c.age}}</span></span>
                <span style="font-weight: 700; font-size: 15px">{{c.name}}</span>
                <span style="font-size: 13px; color: #2B3150">{{c.pets}}</span>
                <span style="border-top: 1.5px dashed #D9DDE6; padding-top: 8px; display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{c.offer}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{c.value}}</span></span>
              </a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>

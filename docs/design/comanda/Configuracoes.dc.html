<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações do ambiente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161A2E}a:hover{color:#3B4160}
</style>
</helmet>
<div style="min-height: 1100px; background: #EFF1F5; color: #161A2E; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">
  <nav aria-label="Navegação principal" style="flex: 1 1 76px; max-width: 100%; background: #161A2E; padding: 20px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; flex-direction: column; align-items: center; gap: 8px">
    <a href="Hoje.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 9h.01M19 9h.01M8 5h.01M16 5h.01M7 17c1-2.5 3-3.5 5-3.5s4 1 5 3.5c.6 1.5-.6 3-2.2 2.6-1-.2-1.8-.6-2.8-.6s-1.8.4-2.8.6C7.6 20 6.4 18.5 7 17z"></path></svg></a>
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="12"><a href="{{item.href}}" aria-label="{{item.label}}" title="{{item.label}}" style="{{item.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></a></sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-direction: column; gap: 8px">
      <div role="tablist" aria-label="Seção" style="display: inline-flex; gap: 4px; padding: 4px; background: #E3E6ED; border-radius: 12px; width: max-content">
        <a href="Configuracoes.dc.html" role="tab" aria-selected="true" style="height: 34px; padding: 0 14px; border-radius: 9px; background: #FFFFFF; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none">Ambiente</a>
        <a href="Usuarios.dc.html" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: #2B3150; display: inline-flex; align-items: center; text-decoration: none">Usuários</a>
        <a href="Ambientes.dc.html" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: #2B3150; display: inline-flex; align-items: center; text-decoration: none">Plataforma</a>
      </div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em">Configurações</h1>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <nav aria-label="Seções das configurações" style="flex: 1 1 200px; max-width: 100%; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="5"><a href="#" style="{{s.style}}">{{s.label}}</a></sc-for>
      </nav>

      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <section style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Sua loja</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
            <div style="display: flex; flex-direction: column; gap: 8px; align-items: center">
              <span style="width: 96px; height: 96px; border-radius: 24px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px">PE</span>
              <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #D9DDE6; background: #FFFFFF; font: 600 13px 'Instrument Sans', sans-serif; color: #161A2E">Trocar logo</button>
            </div>
            <div style="flex: 1 1 320px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
              <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Nome que aparece no sistema<input type="text" value="Pet Shop Exemplo" style="height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 500 15px 'Instrument Sans', sans-serif; color: #161A2E"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0">Unidade<input type="text" value="Centro" style="height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 500 15px 'Instrument Sans', sans-serif; color: #161A2E; min-width: 0"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0">CNPJ<input type="text" value="00.000.000/0001-00" style="height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 600 15px 'IBM Plex Mono', monospace; color: #161A2E; min-width: 0"></label>
            </div>
          </div>
          <div role="radiogroup" aria-label="Cor de destaque" style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px; font-weight: 600">Cor de destaque</span>
            <div style="display: flex; gap: 10px">
              <sc-for list="{{swatches}}" as="w" hint-placeholder-count="4"><label style="{{w.style}}"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{w.name}}</span><input type="radio" name="cor" checked="{{w.selected}}" style="position: absolute; opacity: 0; width: 1px; height: 1px"></label></sc-for>
            </div>
          </div>
        </section>

        <section style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
            <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Módulos contratados</h2>
            <span style="font-size: 13px; color: #4A5170">5 de 6 ativos</span>
          </div>
          <sc-for list="{{modules}}" as="m" hint-placeholder-count="6">
            <div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid #EEF0F4">
              <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0"><span style="font-weight: 700; font-size: 15px">{{m.name}}</span><span style="font-size: 13px; color: #4A5170">{{m.desc}}</span></span>
              <span style="{{m.style}}">{{m.status}}</span>
            </div>
          </sc-for>
        </section>

        <section style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Aparência</h2>
          <div role="radiogroup" aria-label="Tema" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 560px">
            <label style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 2px solid #161A2E; cursor: pointer"><input type="radio" name="tema" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="height: 64px; border-radius: 8px; background: #EFF1F5; border: 1px solid #D9DDE6"></span><span style="font-size: 14px; font-weight: 700">Claro</span></label>
            <label style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 1.5px solid #D9DDE6; cursor: pointer"><input type="radio" name="tema" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="height: 64px; border-radius: 8px; background: #161A2E"></span><span style="font-size: 14px; font-weight: 600">Escuro</span></label>
            <label style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 1.5px solid #D9DDE6; cursor: pointer"><input type="radio" name="tema" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="height: 64px; border-radius: 8px; background: #161A2E; box-shadow: inset -60px 0 0 #EFF1F5"></span><span style="font-size: 14px; font-weight: 600">Igual ao sistema</span></label>
          </div>
        </section>

        <section style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px">Segurança da conta</h2>
          <p style="margin: 0; font-size: 14px; color: #2B3150">Troque sua senha sem sair do sistema. As outras sessões serão encerradas.</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0">Senha atual<input type="password" style="height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 500 15px 'Instrument Sans', sans-serif; min-width: 0"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0">Nova senha<input type="password" style="height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 500 15px 'Instrument Sans', sans-serif; min-width: 0"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0">Repita a nova<input type="password" style="height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 500 15px 'Instrument Sans', sans-serif; min-width: 0"></label>
          </div>
          <button type="button" style="align-self: flex-start; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #161A2E; color: #FFFFFF; font: 600 15px 'Instrument Sans', sans-serif">Trocar senha</button>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC633","options":["#FFC633","#FF8A3D","#7BE0B0","#9CC8FF"]},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFC633';
    const I = {hoje:'M3 10h18M7 3v4M17 3v4M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',agenda:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',clientes:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',planos:'M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5',pdv:'M3 7h18v10H3zM7 12h.01M17 12h.01M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',estoque:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',financeiro:'M3 7h15a3 3 0 0 1 3 3v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M17 13h.01',equipe:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.4l6-.9z',clinica:'M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z',comercial:'M3 17l6-6 4 4 8-8M15 7h6v6',insights:'M4 20V10M10 20V4M16 20v-7',config:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4'};
    const N = [['hoje','Hoje','Hoje'],['agenda','Agenda','Agenda'],['clientes','Clientes e pets','Clientes'],['planos','Planos','Planos'],['pdv','PDV','PDV'],['estoque','Estoque','Estoque'],['financeiro','Financeiro','Financeiro'],['equipe','Equipe e comissão','Equipe'],['clinica','Clínica','Clinica'],['comercial','Comercial','Comercial'],['insights','Insights','Insights'],['config','Configurações','Configuracoes']];
    const ACTIVE = 'config';
    const nav = N.map(([k, label, f]) => ({ label, d: I[k], href: f + '.dc.html', style: 'width: 48px; height: 48px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; ' + (k === ACTIVE ? 'background: ' + accent + '; color: #161A2E;' : 'color: #D5D8E5;') }));

    const sections = ['Sua loja', 'Módulos', 'Aparência', 'Segurança', 'Avisos aos clientes'].map((label, i) => ({
      label, style: 'height: 44px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; font-size: 15px; text-decoration: none; ' + (i === 0 ? 'background: #FFFFFF; font-weight: 700; color: #161A2E;' : 'font-weight: 600; color: #2B3150;')
    }));
    const swatches = [['Amarelo', '#FFC633'], ['Laranja', '#FF8A3D'], ['Menta', '#7BE0B0'], ['Azul', '#9CC8FF']].map(([name, c]) => ({
      name, selected: c === accent,
      style: 'position: relative; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; background: ' + c + '; ' + (c === accent ? 'box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #161A2E;' : '')
    }));
    const st = (s) => 'padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; ' + (s === 'Ativo' ? 'background: #D7F0E0; color: #1B6B3E;' : s === 'Aguardando liberação' ? 'background: #FFE4D4; color: #A33A06;' : 'background: #E3E6ED; color: #2B3150;');
    const modules = [
      ['Banho e tosa', 'Agenda, clientes, pets, planos e fechamento', 'Ativo'],
      ['PDV e estoque', 'Vendas no balcão e controle de produtos', 'Ativo'],
      ['Financeiro', 'Caixa, cobrança e próximo ciclo', 'Ativo'],
      ['Clínica', 'Prontuário, vacinas e prescrições', 'Ativo'],
      ['Comercial', 'Leads, funil e follow-up', 'Aguardando liberação'],
      ['Hotel e creche', 'Diárias e check-in', 'Não contratado']
    ].map(([name, desc, status]) => ({ name, desc, status, style: st(status) }));
    return { accent, nav, sections, swatches, modules };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pets</title>
<script src="./support.js"></script>
</head>

<x-dc>

</style>
</helmet>

    <a href="Hoje.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 9h.01M19 9h.01M8 5h.01M16 5h.01M7 17c1-2.5 3-3.5 5-3.5s4 1 5 3.5c.6 1.5-.6 3-2.2 2.6-1-.2-1.8-.6-2.8-.6s-1.8.4-2.8.6C7.6 20 6.4 18.5 7 17z"></path></svg></a>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">

      <sc-for list="{{filters}}" as="f" hint-placeholder-count="7"><button type="button" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button></sc-for>
    </div>

    <section aria-label="Pets" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px">
      <sc-for list="{{pets}}" as="p" hint-placeholder-count="12">
        <a href="PetPerfil.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #161A2E; box-shadow: 0 1px 0 #D9DDE6">
          <span style="display: flex; gap: 12px; align-items: center">
            <span style="{{p.avatar}}">{{p.initial}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; line-height: 1">{{p.name}}</span>
              <span style="font-size: 13px; color: #4A5170">{{p.breed}} · {{p.age}}</span>
            </span>
            <span style="margin-left: auto; padding: 3px 8px; border-radius: 6px; border: 1px solid #D9DDE6; font-size: 12px; font-weight: 700; color: #2B3150">{{p.size}}</span>
          </span>
          <span style="display: flex; gap: 5px; flex-wrap: wrap; min-height: 22px"><sc-for list="{{p.tags}}" as="t" hint-placeholder-count="1"><span style="{{t.style}}">{{t.label}}</span></sc-for></span>
          <span style="border-top: 1.5px dashed #D9DDE6; padding-top: 10px; display: flex; justify-content: space-between; font-size: 13px">
            <span style="font-weight: 600">{{p.owner}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; color: #2B3150">{{p.next}}</span>
          </span>
        </a>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>

    const N = [['hoje','Hoje','Hoje'],['agenda','Agenda','Agenda'],['clientes','Clientes e pets','Clientes'],['planos','Planos','Planos'],['pdv','PDV','PDV'],['estoque','Estoque','Estoque'],['financeiro','Financeiro','Financeiro'],['equipe','Equipe e comissão','Equipe'],['clinica','Clínica','Clinica'],['comercial','Comercial','Comercial'],['insights','Insights','Insights'],['config','Configurações','Configuracoes']];

    return { accent, nav, filters, pets };

</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161A2E}a:hover{color:#3B4160}
</style>
</helmet>
<div style="min-height: 1050px; background: #EFF1F5; color: #161A2E; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">
  <nav aria-label="Navegação principal" style="flex: 1 1 76px; max-width: 100%; background: #161A2E; padding: 20px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; flex-direction: column; align-items: center; gap: 8px">
    <a href="Hoje.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 9h.01M19 9h.01M8 5h.01M16 5h.01M7 17c1-2.5 3-3.5 5-3.5s4 1 5 3.5c.6 1.5-.6 3-2.2 2.6-1-.2-1.8-.6-2.8-.6s-1.8.4-2.8.6C7.6 20 6.4 18.5 7 17z"></path></svg></a>
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="12"><a href="{{item.href}}" aria-label="{{item.label}}" title="{{item.label}}" style="{{item.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></a></sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <nav aria-label="Caminho" style="font-size: 13px; color: #4A5170; display: flex; gap: 6px"><a href="Comercial.dc.html" style="color: #4A5170">Comercial</a><span aria-hidden="true">/</span><span style="color: #161A2E; font-weight: 600">Renata Campos</span></nav>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em">Renata Campos</h1>
        <p style="margin: 0; font-size: 15px; color: #2B3150">Indicada por Fernanda Lima · entrou há 2 dias</p>
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <button type="button" style="height: 44px; padding: 0 18px; border: 1.5px solid #E7B8B8; border-radius: 12px; background: #FFFFFF; color: #A61B1B; font: 600 15px 'Instrument Sans', sans-serif">Marcar como perdido</button>
        <a href="ClienteForm.dc.html" style="height: 44px; padding: 0 20px; border-radius: 12px; background: {{accent}}; color: #161A2E; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; text-decoration: none">Converter em cliente</a>
      </div>
    </header>

    <ol aria-label="Etapa do funil" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
        <li aria-current="{{s.current}}" style="display: flex; flex-direction: column; gap: 8px"><span style="{{s.bar}}"></span><span style="{{s.labelStyle}}">{{s.label}}</span></li>
      </sc-for>
    </ol>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <form style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <fieldset style="border: 0; margin: 0; background: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
          <legend style="float: left; padding: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Contato</legend>
          <div style="clear: both; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
            <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0">{{f.label}}<input type="text" value="{{f.value}}" style="{{f.input}}"></label>
            </sc-for>
          </div>
        </fieldset>
        <fieldset style="border: 0; margin: 0; background: #FFFFFF; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
          <legend style="float: left; padding: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Interesse</legend>
          <div style="clear: both; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; background: #EFF1F5">
            <span style="width: 44px; height: 44px; border-radius: 13px; background: #D6E6FF; color: #1A4E9E; display: inline-flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px">P</span>
            <span style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font-weight: 700">Pérola</span><span style="font-size: 13px; color: #4A5170">Lhasa apso · 6 anos · pele sensível</span></span>
            <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1.5px solid #D9DDE6; background: #FFFFFF; font: 600 13px 'Instrument Sans', sans-serif; color: #161A2E">+ Outro pet</button>
          </div>
          <div role="radiogroup" aria-label="Oferta" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px">
            <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
              <label style="{{o.style}}"><input type="radio" name="oferta" checked="{{o.selected}}" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="font-weight: 700; font-size: 15px">{{o.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{o.price}}</span></label>
            </sc-for>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Observações<textarea rows="3" style="padding: 12px 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: 500 15px/1.5 'Instrument Sans', sans-serif; color: #161A2E; resize: vertical">Quer testar um banho hipoalergênico antes de fechar. Prefere sábado de manhã.</textarea></label>
        </fieldset>
      </form>

      <aside style="flex: 1 1 340px; min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 16px">
        <section style="background: #161A2E; color: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700">Próximo passo</h2>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2">Agendar banho teste no sábado</span>
          <a href="Agenda.dc.html" style="height: 44px; border-radius: 12px; background: #FFFFFF; color: #161A2E; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; text-decoration: none">Abrir agenda</a>
        </section>
        <section style="background: #FFFFFF; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px">Histórico</h2>
          <sc-for list="{{log}}" as="l" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid #EEF0F4">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #4A5170; padding-top: 2px">{{l.when}}</span>
              <span style="font-size: 14px; line-height: 1.4">{{l.what}}</span>
            </div>
          </sc-for>
        </section>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC633","options":["#FFC633","#FF8A3D","#7BE0B0","#9CC8FF"]},"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFC633';
    const I = {hoje:'M3 10h18M7 3v4M17 3v4M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',agenda:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',clientes:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',planos:'M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5',pdv:'M3 7h18v10H3zM7 12h.01M17 12h.01M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',estoque:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',financeiro:'M3 7h15a3 3 0 0 1 3 3v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M17 13h.01',equipe:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.4l6-.9z',clinica:'M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z',comercial:'M3 17l6-6 4 4 8-8M15 7h6v6',insights:'M4 20V10M10 20V4M16 20v-7',config:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4'};
    const N = [['hoje','Hoje','Hoje'],['agenda','Agenda','Agenda'],['clientes','Clientes e pets','Clientes'],['planos','Planos','Planos'],['pdv','PDV','PDV'],['estoque','Estoque','Estoque'],['financeiro','Financeiro','Financeiro'],['equipe','Equipe e comissão','Equipe'],['clinica','Clínica','Clinica'],['comercial','Comercial','Comercial'],['insights','Insights','Insights'],['config','Configurações','Configuracoes']];
    const ACTIVE = 'comercial';
    const nav = N.map(([k, label, f]) => ({ label, d: I[k], href: f + '.dc.html', style: 'width: 48px; height: 48px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; ' + (k === ACTIVE ? 'background: ' + accent + '; color: #161A2E;' : 'color: #D5D8E5;') }));

    const CUR = 1;
    const steps = ['Novo lead', 'Primeiro contato', 'Banho teste', 'Proposta', 'Fechado'].map((label, i) => ({
      label, current: i === CUR ? 'step' : 'false',
      bar: 'height: 8px; border-radius: 999px; background: ' + (i < CUR ? '#161A2E' : i === CUR ? accent : '#D9DDE6'),
      labelStyle: 'font-size: 13px; font-weight: ' + (i === CUR ? '700' : '600') + '; color: ' + (i <= CUR ? '#161A2E' : '#4A5170')
    }));
    const inp = (mono) => 'height: 44px; padding: 0 14px; border: 1.5px solid #D9DDE6; border-radius: 12px; font: ' + (mono ? '600 15px \'IBM Plex Mono\', monospace' : '500 15px \'Instrument Sans\', sans-serif') + '; color: #161A2E; min-width: 0';
    const fields = [['Nome', 'Renata Campos'], ['WhatsApp', '(11) 9XXXX-7720', 1], ['E-mail', 'renata@exemplo.com'], ['Origem', 'Indicação · Fernanda Lima'], ['Bairro', 'Vila Mariana'], ['Responsável', 'Marina']].map(([label, value, m]) => ({ label, value, input: inp(m) }));
    const offers = [['Banho avulso', 'R$ 75', false], ['Mensal banho', 'R$ 180/mês', true], ['Mensal completo', 'R$ 260/mês', false]].map(([name, price, sel]) => ({
      name, price, selected: sel,
      style: 'position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; cursor: pointer; ' + (sel ? 'background: ' + accent + '; border: 2px solid #161A2E;' : 'background: #FFFFFF; border: 1.5px solid #D9DDE6;')
    }));
    const log = [['hoje 10:05', 'Marina enviou tabela de planos pelo WhatsApp'], ['ontem', 'Ligação: quer testar antes de fechar'], ['29/10', 'Lead criado a partir da indicação de Fernanda Lima'], ['29/10', 'Movido para Primeiro contato']].map(([when, what]) => ({ when, what }));
    return { accent, nav, steps, fields, offers, log };
  }
}
</script>
</body>
</html>

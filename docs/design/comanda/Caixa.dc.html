<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caixa · movimentações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161A2E}a:hover{color:#3B4160}
</style>
</helmet>
<div style="min-height: 1000px; background: #EFF1F5; color: #161A2E; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">
  <nav aria-label="Navegação principal" style="flex: 1 1 76px; max-width: 100%; background: #161A2E; padding: 20px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; flex-direction: column; align-items: center; gap: 8px">
    <a href="Hoje.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 9h.01M19 9h.01M8 5h.01M16 5h.01M7 17c1-2.5 3-3.5 5-3.5s4 1 5 3.5c.6 1.5-.6 3-2.2 2.6-1-.2-1.8-.6-2.8-.6s-1.8.4-2.8.6C7.6 20 6.4 18.5 7 17z"></path></svg></a>
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="12"><a href="{{item.href}}" aria-label="{{item.label}}" title="{{item.label}}" style="{{item.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></a></sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div role="tablist" aria-label="Seção" style="display: inline-flex; gap: 4px; padding: 4px; background: #E3E6ED; border-radius: 12px; width: max-content">
          <a href="Financeiro.dc.html" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: #2B3150; display: inline-flex; align-items: center; text-decoration: none">Visão geral</a>
          <a href="Caixa.dc.html" role="tab" aria-selected="true" style="height: 34px; padding: 0 14px; border-radius: 9px; background: #FFFFFF; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none">Caixa</a>
          <a href="Cobranca.dc.html" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: #2B3150; display: inline-flex; align-items: center; text-decoration: none">Cobrança</a>
        </div>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em">Caixa de hoje</h1>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <button type="button" style="height: 44px; padding: 0 16px; border: 1.5px solid #C9CEDA; border-radius: 12px; background: #FFFFFF; color: #161A2E; font: 600 15px 'Instrument Sans', sans-serif">Suprimento</button>
        <button type="button" style="height: 44px; padding: 0 16px; border: 1.5px solid #C9CEDA; border-radius: 12px; background: #FFFFFF; color: #161A2E; font: 600 15px 'Instrument Sans', sans-serif">Sangria</button>
        <button type="button" style="height: 44px; padding: 0 16px; border: 1.5px solid #C9CEDA; border-radius: 12px; background: #FFFFFF; color: #161A2E; font: 600 15px 'Instrument Sans', sans-serif">Lançar despesa</button>
        <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #161A2E; color: #FFFFFF; font: 600 15px 'Instrument Sans', sans-serif">Fechar caixa</button>
      </div>
    </header>

    <section style="background: #161A2E; color: #FFFFFF; border-radius: 22px; padding: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px">
        <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #D5D8E5"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7BE0B0"></span>Aberto por Marina às 08:02</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 44px; letter-spacing: -0.02em">R$ 840,00</span>
        <span style="font-size: 14px; color: #D5D8E5">saldo do dia (entradas − saídas)</span>
      </div>
      <dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; flex: 2 1 520px">
        <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 4px; border-left: 1px solid #2E3350; padding-left: 16px">
            <dt style="font-size: 12px; color: #B9BED3">{{m.label}}</dt>
            <dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 20px">{{m.value}}</dd>
            <span style="font-size: 12px; color: #B9BED3">{{m.detail}}</span>
          </div>
        </sc-for>
      </dl>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button></sc-for>
    </div>

    <section aria-label="Movimentações" style="background: #FFFFFF; border-radius: 20px; overflow-x: auto">
      <div style="min-width: 900px">
        <div style="display: grid; grid-template-columns: 70px 110px 2fr 1.2fr 1fr 1fr; gap: 14px; padding: 14px 20px; border-bottom: 1px solid #E6E9EF; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5170">
          <span>Hora</span><span>Tipo</span><span>Descrição</span><span>Forma</span><span>Quem</span><span style="text-align: right">Valor</span>
        </div>
        <sc-for list="{{moves}}" as="m" hint-placeholder-count="9">
          <div style="display: grid; grid-template-columns: 70px 110px 2fr 1.2fr 1fr 1fr; gap: 14px; padding: 12px 20px; border-bottom: 1px solid #EEF0F4; align-items: center; font-size: 14px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">{{m.time}}</span>
            <span style="{{m.typeStyle}}">{{m.type}}</span>
            <span style="font-weight: 600">{{m.desc}}</span>
            <span style="color: #2B3150">{{m.method}}</span>
            <span style="color: #2B3150">{{m.who}}</span>
            <span style="{{m.valueStyle}}">{{m.value}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC633","options":["#FFC633","#FF8A3D","#7BE0B0","#9CC8FF"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFC633';
    const I = {hoje:'M3 10h18M7 3v4M17 3v4M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',agenda:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',clientes:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',planos:'M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5',pdv:'M3 7h18v10H3zM7 12h.01M17 12h.01M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',estoque:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',financeiro:'M3 7h15a3 3 0 0 1 3 3v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M17 13h.01',equipe:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.4l6-.9z',clinica:'M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z',comercial:'M3 17l6-6 4 4 8-8M15 7h6v6',insights:'M4 20V10M10 20V4M16 20v-7',config:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4'};
    const N = [['hoje','Hoje','Hoje'],['agenda','Agenda','Agenda'],['clientes','Clientes e pets','Clientes'],['planos','Planos','Planos'],['pdv','PDV','PDV'],['estoque','Estoque','Estoque'],['financeiro','Financeiro','Financeiro'],['equipe','Equipe e comissão','Equipe'],['clinica','Clínica','Clinica'],['comercial','Comercial','Comercial'],['insights','Insights','Insights'],['config','Configurações','Configuracoes']];
    const ACTIVE = 'financeiro';
    const nav = N.map(([k, label, f]) => ({ label, d: I[k], href: f + '.dc.html', style: 'width: 48px; height: 48px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; ' + (k === ACTIVE ? 'background: ' + accent + '; color: #161A2E;' : 'color: #D5D8E5;') }));

    const methods = [['Dinheiro na gaveta', 'R$ 310,00', 'troco R$ 200 incluso'], ['Pix', 'R$ 524,90', '5 recebimentos'], ['Cartão', 'R$ 245,00', '3 transações'], ['Saídas', '− R$ 620,00', '1 despesa']].map(([label, value, detail]) => ({ label, value, detail }));
    const filters = ['Tudo', 'Entradas', 'Saídas', 'Sangria e suprimento'].map((label, i) => ({
      label, pressed: i === 0 ? 'true' : 'false',
      style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: 600 14px \'Instrument Sans\', sans-serif; ' + (i === 0 ? 'border: 0; background: #161A2E; color: #FFFFFF;' : 'border: 1.5px solid #D9DDE6; background: #FFFFFF; color: #2B3150;')
    }));
    const T = { Entrada: ['#D7F0E0', '#1B6B3E'], Saída: ['#FFE4D4', '#A33A06'], Suprimento: ['#E3E6ED', '#2B3150'] };
    const moves = [
      ['11:20', 'Entrada', 'Venda #0482 · Ana Paula · Thor', 'Pix', 'Marina', 'R$ 129,90'],
      ['10:55', 'Entrada', 'Banho + escovação · Fred', 'Cartão crédito', 'Marina', 'R$ 75,00'],
      ['10:40', 'Entrada', 'Ração Premium 3 kg', 'Dinheiro', 'Marina', 'R$ 89,90'],
      ['10:10', 'Saída', 'Fornecedor PetClean · nota 3381', 'Boleto', 'Marina', 'R$ 620,00'],
      ['09:55', 'Entrada', 'Banho terapêutico · Zeus', 'Pix', 'Marina', 'R$ 110,00'],
      ['09:40', 'Entrada', 'Plano mensal · Luna', 'Pix', 'Marina', 'R$ 180,00'],
      ['09:12', 'Entrada', 'Petisco bifinho ×2', 'Dinheiro', 'Marina', 'R$ 25,00'],
      ['08:40', 'Entrada', 'Corte de unhas · Pipoca', 'Cartão débito', 'Marina', 'R$ 20,00'],
      ['08:02', 'Suprimento', 'Abertura · troco inicial', 'Dinheiro', 'Marina', 'R$ 200,00']
    ].map(([time, type, desc, method, who, value]) => ({
      time, type, desc, method, who, value: (type === 'Saída' ? '− ' : '+ ') + value,
      typeStyle: 'justify-self: start; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: ' + T[type][0] + '; color: ' + T[type][1],
      valueStyle: 'font-family: \'IBM Plex Mono\', monospace; font-weight: 600; text-align: right; color: ' + (type === 'Saída' ? '#A33A06' : '#161A2E')
    }));
    return { accent, nav, methods, filters, moves };
  }
}
</script>
</body>
</html>

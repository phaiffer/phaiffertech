<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estoque e produtos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161A2E}a:hover{color:#3B4160}
</style>
</helmet>
<div style="min-height: 1050px; background: #EFF1F5; color: #161A2E; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">
  <nav aria-label="Navegação principal" style="flex: 1 1 76px; max-width: 100%; background: #161A2E; padding: 20px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; flex-direction: column; align-items: center; gap: 8px">
    <a href="Hoje.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 9h.01M19 9h.01M8 5h.01M16 5h.01M7 17c1-2.5 3-3.5 5-3.5s4 1 5 3.5c.6 1.5-.6 3-2.2 2.6-1-.2-1.8-.6-2.8-.6s-1.8.4-2.8.6C7.6 20 6.4 18.5 7 17z"></path></svg></a>
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="12"><a href="{{item.href}}" aria-label="{{item.label}}" title="{{item.label}}" style="{{item.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></a></sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5170">Estoque</span>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em">Produtos</h1>
        <p style="margin: 0; font-size: 15px; color: #2B3150">184 itens · <strong style="color: #A33A06">3 abaixo do ponto de reposição</strong> · <strong style="font-family: 'IBM Plex Mono', monospace">R$ 21.380,00</strong> em estoque</p>
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <button type="button" style="height: 44px; padding: 0 18px; border: 1.5px solid #C9CEDA; border-radius: 12px; background: #FFFFFF; color: #161A2E; font: 600 15px 'Instrument Sans', sans-serif">Entrada de nota</button>
        <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #161A2E; color: #FFFFFF; font: 600 15px 'Instrument Sans', sans-serif">Novo produto</button>
      </div>
    </header>

    <section aria-labelledby="repor-h" style="background: #FFE4D4; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
        <h2 id="repor-h" style="margin: 0; font-size: 15px; font-weight: 700; color: #7A2B04">Repor antes de faltar</h2>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: #161A2E; color: #FFFFFF; font: 700 13px 'Instrument Sans', sans-serif">Gerar pedido de compra</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px">
        <sc-for list="{{low}}" as="l" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 14px">{{l.name}}</span><span style="font-size: 12px; color: #4A5170">{{l.use}}</span></span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; color: #A33A06; white-space: nowrap">{{l.qty}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; background: #FFFFFF; border: 1.5px solid #D9DDE6; border-radius: 12px; flex: 1 1 260px; max-width: 360px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5170" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar produto ou SKU</span>
        <input type="search" placeholder="Produto ou SKU" style="border: 0; outline: none; font: 500 15px 'Instrument Sans', sans-serif; background: transparent; flex: 1 1 auto; min-width: 0">
      </label>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
    </div>

    <section aria-label="Produtos" style="background: #FFFFFF; border-radius: 20px; overflow-x: auto">
      <div style="min-width: 940px">
        <div style="display: grid; grid-template-columns: 2.2fr 1fr 1.2fr 2fr 1fr 60px; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #E6E9EF; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5170">
          <span>Produto</span><span>SKU</span><span>Uso</span><span>Quantidade · ponto de reposição</span><span style="text-align: right">Preço</span><span></span>
        </div>
        <sc-for list="{{items}}" as="p" hint-placeholder-count="8">
          <div style="display: grid; grid-template-columns: 2.2fr 1fr 1.2fr 2fr 1fr 60px; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #EEF0F4; align-items: center">
            <span style="font-weight: 700; font-size: 15px">{{p.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #2B3150">{{p.sku}}</span>
            <span style="{{p.catStyle}}">{{p.cat}}</span>
            <span style="display: flex; align-items: center; gap: 10px">
              <span style="position: relative; flex: 1 1 auto; height: 10px; border-radius: 999px; background: #EFF1F5; overflow: hidden"><span style="{{p.bar}}"></span><span style="{{p.mark}}"></span></span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; min-width: 84px; text-align: right">{{p.qty}}</span>
            </span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; text-align: right">{{p.price}}</span>
            <button type="button" aria-label="Ajustar estoque" style="width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #D9DDE6; background: #FFFFFF; color: #161A2E; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19h14M5 15l9-9 3 3-9 9H5z"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC633","options":["#FFC633","#FF8A3D","#7BE0B0","#9CC8FF"]},"$preview":{"width":1440,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFC633';
    const I = {hoje:'M3 10h18M7 3v4M17 3v4M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',agenda:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',clientes:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',planos:'M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5',pdv:'M3 7h18v10H3zM7 12h.01M17 12h.01M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',estoque:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',financeiro:'M3 7h15a3 3 0 0 1 3 3v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M17 13h.01',equipe:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.4l6-.9z',clinica:'M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z',comercial:'M3 17l6-6 4 4 8-8M15 7h6v6',insights:'M4 20V10M10 20V4M16 20v-7',config:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4'};
    const N = [['hoje','Hoje','Hoje'],['agenda','Agenda','Agenda'],['clientes','Clientes e pets','Clientes'],['planos','Planos','Planos'],['pdv','PDV','PDV'],['estoque','Estoque','Estoque'],['financeiro','Financeiro','Financeiro'],['equipe','Equipe e comissão','Equipe'],['clinica','Clínica','Clinica'],['comercial','Comercial','Comercial'],['insights','Insights','Insights'],['config','Configurações','Configuracoes']];
    const ACTIVE = 'estoque';
    const nav = N.map(([k, label, f]) => ({ label, d: I[k], href: f + '.dc.html', style: 'width: 48px; height: 48px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; ' + (k === ACTIVE ? 'background: ' + accent + '; color: #161A2E;' : 'color: #D5D8E5;') }));

    const low = [['Shampoo neutro 5 L', 'Consumo no banho · ~0,4 L/dia', '1 de 3'], ['Ração Filhote 1 kg', 'Loja', '2 de 6'], ['Laço de cetim', 'Consumo na tosa', '12 de 30']].map(([name, use, qty]) => ({ name, use, qty }));
    const cats = ['Todos', 'Loja', 'Consumo no banho e tosa', 'Insumo veterinário'].map((label, i) => ({
      label, pressed: i === 0 ? 'true' : 'false',
      style: 'height: 40px; padding: 0 14px; border-radius: 999px; font: 600 14px \'Instrument Sans\', sans-serif; ' + (i === 0 ? 'border: 0; background: #161A2E; color: #FFFFFF;' : 'border: 1.5px solid #D9DDE6; background: #FFFFFF; color: #2B3150;')
    }));
    const C = { Loja: ['#D6E6FF', '#1A4E9E'], Consumo: ['#E8DFFF', '#4E33A3'], Veterinário: ['#D7F0E0', '#1B6B3E'] };
    const items = [
      ['Shampoo neutro 5 L', 'SH-005', 'Consumo', 1, 3, 10, 'un.', 'R$ 89,00'],
      ['Shampoo hipoalergênico 500 ml', 'SH-H50', 'Loja', 6, 4, 20, 'un.', 'R$ 42,00'],
      ['Ração Premium adulto 3 kg', '7891000', 'Loja', 14, 6, 30, 'un.', 'R$ 89,90'],
      ['Ração Filhote 1 kg', '7891002', 'Loja', 2, 6, 20, 'un.', 'R$ 39,90'],
      ['Condicionador desembaraçante', 'CD-020', 'Consumo', 4, 2, 8, 'L', 'R$ 64,00'],
      ['Laço de cetim', 'AC-LAC', 'Consumo', 12, 30, 120, 'un.', 'R$ 4,00'],
      ['Clorexidina 2% 1 L', 'VT-CLX', 'Veterinário', 3, 2, 6, 'L', 'R$ 58,00'],
      ['Petisco bifinho 65 g', '7893300', 'Loja', 40, 15, 80, 'un.', 'R$ 12,50']
    ].map(([name, sku, cat, qty, reorder, max, unit, price]) => {
      const lowQ = qty < reorder;
      return {
        name, sku, price, cat: cat === 'Consumo' ? 'Consumo' : cat, qty: qty + ' ' + unit + ' · ' + reorder,
        catStyle: 'justify-self: start; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: ' + C[cat][0] + '; color: ' + C[cat][1],
        bar: 'position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; width: ' + Math.min(100, Math.round(qty / max * 100)) + '%; background: ' + (lowQ ? '#D9590F' : '#161A2E'),
        mark: 'position: absolute; top: -2px; bottom: -2px; width: 2px; background: #A33A06; left: ' + Math.round(reorder / max * 100) + '%'
      };
    });
    return { accent, nav, low, cats, items };
  }
}
</script>
</body>
</html>

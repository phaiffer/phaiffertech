<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Catálogo de serviços</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161A2E}a:hover{color:#3B4160}
</style>
</helmet>
<div style="min-height: 1000px; background: #EFF1F5; color: #161A2E; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: stretch">
  <nav aria-label="Navegação principal" style="flex: 1 1 76px; max-width: 100%; background: #161A2E; padding: 20px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; flex-direction: column; align-items: center; gap: 8px">
    <a href="Hoje.dc.html" aria-label="Início" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#161A2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M5 9h.01M19 9h.01M8 5h.01M16 5h.01M7 17c1-2.5 3-3.5 5-3.5s4 1 5 3.5c.6 1.5-.6 3-2.2 2.6-1-.2-1.8-.6-2.8-.6s-1.8.4-2.8.6C7.6 20 6.4 18.5 7 17z"></path></svg></a>
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="12"><a href="{{item.href}}" aria-label="{{item.label}}" title="{{item.label}}" style="{{item.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg></a></sc-for>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5170">Agenda · catálogo</span>
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.03em">Serviços</h1>
        <p style="margin: 0; font-size: 15px; color: #2B3150; max-width: 640px">Preço e tempo por porte. O que estiver ativo aparece na agenda e no PDV; o que aceita plano pode ser vendido em pacote.</p>
      </div>
      <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #161A2E; color: #FFFFFF; font: 600 15px 'Instrument Sans', sans-serif; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Novo serviço</button>
    </header>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="background: #FFFFFF; border-radius: 20px; overflow-x: auto">
        <div style="min-width: 940px">
          <div style="display: grid; grid-template-columns: 2.4fr repeat(4, 1fr) 1fr 1fr 80px; gap: 12px; padding: 16px 20px 12px; align-items: end; border-bottom: 1px solid #E6E9EF">
            <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">{{g.title}}</h2>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170; text-align: right">P</span>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170; text-align: right">M</span>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170; text-align: right">G</span>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170; text-align: right">GG</span>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170">Plano</span>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170">Comissão</span>
            <span style="font-size: 12px; font-weight: 700; color: #4A5170">Ativo</span>
          </div>
          <sc-for list="{{g.items}}" as="s" hint-placeholder-count="3">
            <div style="{{s.rowStyle}}">
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 15px">{{s.name}}</span><span style="font-size: 12px; color: #4A5170">{{s.detail}}</span></span>
              <sc-for list="{{s.prices}}" as="p" hint-placeholder-count="4">
                <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{p.price}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4A5170">{{p.time}}</span></span>
              </sc-for>
              <span style="{{s.planStyle}}">{{s.plan}}</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{s.commission}}</span>
              <label style="display: inline-flex; align-items: center; min-height: 44px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ativo para agenda</span><input type="checkbox" checked="{{s.active}}" style="position: absolute; opacity: 0; width: 1px; height: 1px"><span style="{{s.track}}"><span style="{{s.knob}}"></span></span></label>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC633","options":["#FFC633","#FF8A3D","#7BE0B0","#9CC8FF"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFC633';
    const I = {hoje:'M3 10h18M7 3v4M17 3v4M5 6h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',agenda:'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',clientes:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',planos:'M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5',pdv:'M3 7h18v10H3zM7 12h.01M17 12h.01M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',estoque:'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',financeiro:'M3 7h15a3 3 0 0 1 3 3v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4v4M17 13h.01',equipe:'M12 3l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.4l6-.9z',clinica:'M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z',comercial:'M3 17l6-6 4 4 8-8M15 7h6v6',insights:'M4 20V10M10 20V4M16 20v-7',config:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4'};
    const N = [['hoje','Hoje','Hoje'],['agenda','Agenda','Agenda'],['clientes','Clientes e pets','Clientes'],['planos','Planos','Planos'],['pdv','PDV','PDV'],['estoque','Estoque','Estoque'],['financeiro','Financeiro','Financeiro'],['equipe','Equipe e comissão','Equipe'],['clinica','Clínica','Clinica'],['comercial','Comercial','Comercial'],['insights','Insights','Insights'],['config','Configurações','Configuracoes']];
    const ACTIVE = 'agenda';
    const nav = N.map(([k, label, f]) => ({ label, d: I[k], href: f + '.dc.html', style: 'width: 48px; height: 48px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; ' + (k === ACTIVE ? 'background: ' + accent + '; color: #161A2E;' : 'color: #D5D8E5;') }));

    const svc = (name, detail, prices, times, plan, commission, active) => ({
      name, detail, commission, active: !!active, plan: plan ? 'Aceita' : 'Avulso',
      prices: prices.map((p, i) => ({ price: p, time: times[i] })),
      planStyle: 'justify-self: start; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; ' + (plan ? 'background: #D7F0E0; color: #1B6B3E;' : 'border: 1px solid #D9DDE6; color: #2B3150;'),
      rowStyle: 'display: grid; grid-template-columns: 2.4fr repeat(4, 1fr) 1fr 1fr 80px; gap: 12px; padding: 10px 20px; align-items: center; border-bottom: 1px solid #EEF0F4; ' + (active ? '' : 'opacity: 0.55;'),
      track: 'position: relative; width: 44px; height: 26px; border-radius: 999px; display: inline-block; background: ' + (active ? '#161A2E' : '#C9CEDA'),
      knob: 'position: absolute; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: ' + (active ? accent : '#FFFFFF') + '; left: ' + (active ? '21px' : '3px')
    });
    const groups = [
      { title: 'Banho', items: [
        svc('Banho simples', 'Shampoo neutro, secagem e escovação', ['R$ 50', 'R$ 65', 'R$ 85', 'R$ 110'], ['45 min', '1h', '1h15', '1h30'], true, '10%', true),
        svc('Banho + hidratação', 'Máscara de hidratação inclusa', ['R$ 75', 'R$ 90', 'R$ 115', 'R$ 140'], ['1h', '1h15', '1h30', '2h'], true, '12%', true),
        svc('Banho terapêutico', 'Com prescrição veterinária', ['R$ 80', 'R$ 95', 'R$ 120', 'R$ 150'], ['1h', '1h15', '1h30', '2h'], false, '12%', true)
      ] },
      { title: 'Tosa', items: [
        svc('Tosa higiênica', 'Barriga, patas e região íntima', ['R$ 35', 'R$ 45', 'R$ 55', 'R$ 70'], ['30 min', '40 min', '50 min', '1h'], true, '15%', true),
        svc('Tosa bebê', 'Máquina no corpo, tesoura no rosto', ['R$ 90', 'R$ 110', 'R$ 140', 'R$ 180'], ['1h30', '2h', '2h30', '3h'], true, '20%', true),
        svc('Tosa da raça', 'Padrão de raça, só tesoura', ['R$ 130', 'R$ 160', 'R$ 200', 'R$ 260'], ['2h', '2h30', '3h', '3h30'], false, '20%', true)
      ] },
      { title: 'Extras', items: [
        svc('Corte de unhas', 'Pode ser vendido no balcão', ['R$ 20', 'R$ 20', 'R$ 25', 'R$ 30'], ['10 min', '10 min', '15 min', '15 min'], true, '10%', true),
        svc('Pet taxi', 'Coleta e entrega até 5 km', ['R$ 15', 'R$ 15', 'R$ 20', 'R$ 25'], ['—', '—', '—', '—'], true, '—', true),
        svc('Desembolo', 'Cobrado por 15 min', ['R$ 25', 'R$ 30', 'R$ 35', 'R$ 45'], ['15 min', '15 min', '15 min', '15 min'], false, '15%', false)
      ] }
    ];
    return { accent, nav, groups };
  }
}
</script>
</body>
</html>

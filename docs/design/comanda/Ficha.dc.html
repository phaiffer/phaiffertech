<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ficha do pet no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#161A2E}a:hover{color:#3B4160}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFF1F5; color: #161A2E; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #161A2E; color: #FFFFFF; padding: 20px 20px 72px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="#" aria-label="Voltar para a esteira" style="width: 44px; height: 44px; border-radius: 12px; background: #2E3350; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #D5D8E5">09:30 → 11:00</span>
      <button type="button" aria-label="Ligar para a tutora" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #2E3350; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></button>
    </div>
    <div style="display: flex; gap: 14px; align-items: center">
      <span style="width: 64px; height: 64px; border-radius: 18px; background: #E8DFFF; color: #4E33A3; display: inline-flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px">L</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -0.03em">Luna</h1>
        <span style="font-size: 14px; color: #D5D8E5">Yorkshire · 4 anos · 3,2 kg</span>
      </div>
    </div>
  </div>

  <div style="margin: -52px 16px 0; background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 14px 30px -20px rgba(22,26,46,.5); position: relative">
    <span aria-hidden="true" style="position: absolute; top: 10px; left: 50%; margin-left: -7px; width: 14px; height: 14px; border-radius: 50%; background: #EFF1F5; box-shadow: inset 0 1px 2px rgba(22,26,46,.25)"></span>
    <ol aria-label="Estágio do atendimento" style="list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 6px; border-radius: 999px; background: #2F6FD6"></span><span style="font-size: 11px; font-weight: 600; color: #2B3150">Chegou</span></li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 6px; border-radius: 999px; background: #2F6FD6"></span><span style="font-size: 11px; font-weight: 600; color: #2B3150">Banho</span></li>
      <li aria-current="step" style="display: flex; flex-direction: column; gap: 6px"><span style="height: 6px; border-radius: 999px; background: #7350D9"></span><span style="font-size: 11px; font-weight: 700; color: #4E33A3">Tosa · agora</span></li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 6px; border-radius: 999px; background: #E3E6ED"></span><span style="font-size: 11px; font-weight: 600; color: #4A5170">Pronto</span></li>
    </ol>
    <div style="border-top: 1.5px dashed #D9DDE6; padding-top: 12px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; color: #4A5170">Tutora</span>
      <span style="font-size: 15px; font-weight: 600">Fernanda Lima · Plano 1/4</span>
    </div>
  </div>

  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto">
    <div style="display: flex; gap: 10px; align-items: flex-start; background: #FFE4D4; color: #7A2B04; border-radius: 14px; padding: 12px 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <span style="font-size: 14px; line-height: 1.4"><strong>Pele sensível.</strong> Usar shampoo hipoalergênico, sem perfume.</span>
    </div>

    <section style="background: #FFFFFF; border-radius: 16px; padding: 6px 14px">
      <h2 style="margin: 10px 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5170">Serviços</h2>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #E6E9EF; font-size: 15px">
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #161A2E; margin: 0">
        <span style="flex: 1 1 auto; text-decoration: line-through; color: #4A5170">Banho hipoalergênico</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #E6E9EF; font-size: 15px">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #161A2E; margin: 0">
        <span style="flex: 1 1 auto; font-weight: 600">Tosa bebê</span>
        <span style="font-size: 12px; color: #4A5170">tesoura no rosto</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 15px">
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #161A2E; margin: 0">
        <span style="flex: 1 1 auto; font-weight: 600">Corte de unhas</span>
      </label>
    </section>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1 1 0; height: 44px; border-radius: 12px; border: 1.5px solid #C9CEDA; background: #FFFFFF; color: #161A2E; font: 600 14px 'Instrument Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto</button>
      <button type="button" style="flex: 1 1 0; height: 44px; border-radius: 12px; border: 1.5px solid #C9CEDA; background: #FFFFFF; color: #161A2E; font: 600 14px 'Instrument Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19h14M5 15l9-9 3 3-9 9H5z"></path></svg>Observação</button>
    </div>
  </div>

  <div style="padding: 16px; background: #EFF1F5">
    <button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: #161A2E; font: 700 17px 'Instrument Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Marcar como pronto e avisar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC633","options":["#FFC633","#FF8A3D","#7BE0B0","#9CC8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFC633' };
  }
}
</script>
</body>
</html>

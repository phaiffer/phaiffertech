<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clientes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1A}a:hover{color:#000000}
</style>
</helmet>
<div style="min-height: 960px; background: #FFFFFF; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Navegação principal" style="flex: 1 1 220px; max-width: 100%; background: #F7F7F5; border-right: 1px solid #E6E6E1; padding: 12px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; border: 0; background: transparent; text-align: left; font: inherit; color: inherit; border-radius: 6px">
      <span style="width: 24px; height: 24px; border-radius: 5px; background: #1C1C1A; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">PE</span>
      <span style="display: flex; flex-direction: column; flex: 1 1 auto; line-height: 1.25"><span style="font-weight: 600">Pet Shop Exemplo</span><span style="font-size: 12px; color: #5F5F5A">Unidade Centro</span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F5F5A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border: 1px solid #E0E0DA; background: #FFFFFF; border-radius: 6px; font: inherit; color: #5F5F5A; text-align: left">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="flex: 1 1 auto">Buscar pet ou tutor</span>
      <kbd style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5F5F5A; border: 1px solid #E0E0DA; border-radius: 4px; padding: 0 4px">/</kbd>
    </button>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 12px; color: #6B6B65; padding: 0 10px 4px">{{g.title}}</span>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
          <a href="{{i.href}}" style="{{i.style}}"><span style="flex: 1 1 auto">{{i.label}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5F5A">{{i.count}}</span></a>
        </sc-for>
      </div>
    </sc-for>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 1px; border-top: 1px solid #E6E6E1; padding-top: 10px">
      <a href="../Configuracoes.dc.html" style="display: flex; align-items: center; min-height: 36px; padding: 0 10px; border-radius: 6px; text-decoration: none; color: #3A3A36">Configurações</a>
      <span style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; color: #5F5F5A; font-size: 13px">Marina · recepção</span>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #E6E6E1">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600">Clientes</h1>
        <span style="font-family: 'IBM Plex Mono', monospace; color: #5F5F5A">248</span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #D6D6D0; border-radius: 6px; background: #FFFFFF; font: 500 14px 'IBM Plex Sans', sans-serif; color: #1C1C1A">Importar planilha</button>
        <a href="../ClienteForm.dc.html" style="height: 36px; padding: 0 12px; border-radius: 6px; background: #1C1C1A; color: #FFFFFF; font-weight: 500; display: inline-flex; align-items: center; text-decoration: none">Novo cliente</a>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 24px; border-bottom: 1px solid #E6E6E1">
      <label style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #D6D6D0; border-radius: 6px; flex: 1 1 240px; max-width: 320px; box-sizing: border-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F5F5A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filtrar clientes</span>
        <input type="search" placeholder="Nome, pet, telefone ou CPF" style="border: 0; outline: none; font: 400 14px 'IBM Plex Sans', sans-serif; background: transparent; flex: 1 1 auto; min-width: 0">
      </label>
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button type="button" style="height: 36px; padding: 0 10px; border: 1px dashed #C9C9C3; border-radius: 6px; background: #FFFFFF; font: 400 14px 'IBM Plex Sans', sans-serif; color: #3A3A36; display: inline-flex; align-items: center; gap: 6px">{{f.label}}<span style="{{f.valueStyle}}">{{f.value}}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg></button>
      </sc-for>
      <span style="margin-left: auto; font-size: 13px; color: #5F5F5A">Ordenado por última visita</span>
    </div>

    <section aria-label="Lista de clientes" style="overflow-x: auto">
      <div style="min-width: 960px">
        <div style="display: grid; grid-template-columns: 44px 2fr 1.6fr 1.3fr 1.2fr 0.9fr 0.9fr; gap: 12px; padding: 0 24px; height: 36px; align-items: center; border-bottom: 1px solid #E6E6E1; font-size: 12px; color: #5F5F5A; background: #FBFBFA">
          <label style="display: flex; align-items: center; justify-content: center; height: 36px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Selecionar todos</span><input type="checkbox" style="margin: 0; width: 15px; height: 15px; accent-color: #1C1C1A"></label>
          <span>Tutor</span><span>Pets</span><span>Telefone</span><span>Plano</span><span style="display: flex; gap: 4px; align-items: center; color: #1C1C1A">Última visita <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg></span><span style="text-align: right">Em aberto</span>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
          <div style="{{r.rowStyle}}">
            <label style="display: flex; align-items: center; justify-content: center; height: 40px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Selecionar {{r.name}}</span><input type="checkbox" checked="{{r.checked}}" style="margin: 0; width: 15px; height: 15px; accent-color: #1C1C1A"></label>
            <a href="../ClienteForm.dc.html" style="font-weight: 500; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</a>
            <span style="color: #3A3A36; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.pets}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3A3A36">{{r.phone}}</span>
            <span style="{{r.planStyle}}">{{r.plan}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3A3A36">{{r.last}}</span>
            <span style="{{r.balStyle}}">{{r.balance}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 10px 24px; border-top: 1px solid #E6E6E1; margin-top: auto; font-size: 13px; color: #5F5F5A">
      <span>2 selecionados · <a href="#" style="font-weight: 500">Enviar mensagem</a> · <a href="#" style="font-weight: 500">Exportar</a></span>
      <span style="display: flex; gap: 6px; align-items: center"><span style="font-family: 'IBM Plex Mono', monospace">1–14 de 248</span>
        <button type="button" aria-label="Página anterior" style="width: 32px; height: 32px; border: 1px solid #D6D6D0; border-radius: 6px; background: #FFFFFF; color: #A0A09A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
        <button type="button" aria-label="Próxima página" style="width: 32px; height: 32px; border: 1px solid #D6D6D0; border-radius: 6px; background: #FFFFFF; color: #1C1C1A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
      </span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const navItem = (label, href, count, active) => ({
      label, href, count: count || '',
      style: 'display: flex; align-items: center; min-height: 36px; padding: 0 10px; border-radius: 6px; text-decoration: none; ' + (active ? 'background: #EAEAE5; color: #1C1C1A; font-weight: 600;' : 'color: #3A3A36;')
    });
    const groups = [
      { title: 'Operação', items: [navItem('Hoje', 'Hoje.dc.html', '14'), navItem('Agenda', '../Agenda.dc.html'), navItem('PDV', 'PDV.dc.html')] },
      { title: 'Cadastros', items: [navItem('Clientes', 'Clientes.dc.html', '248', true), navItem('Pets', '../Pets.dc.html'), navItem('Serviços', '../Servicos.dc.html'), navItem('Planos', '../Planos.dc.html', '96')] },
      { title: 'Gestão', items: [navItem('Estoque', '../Estoque.dc.html', '3'), navItem('Financeiro', '../Financeiro.dc.html'), navItem('Equipe', '../Equipe.dc.html'), navItem('Clínica', '../Clinica.dc.html'), navItem('Comercial', '../Comercial.dc.html'), navItem('Relatórios', '../Insights.dc.html')] }
    ];
    const filters = [['Situação', 'Ativos', true], ['Plano', 'Qualquer', false], ['Pet', 'Qualquer', false]].map(([label, value, set]) => ({
      label, value, valueStyle: set ? 'font-weight: 600; color: #1C1C1A' : 'color: #5F5F5A'
    }));
    const rows = [
      ['Ana Paula Souza', 'Thor', '(11) 9XXXX-1020', 'Mensal 3/4', 'hoje', '—'],
      ['Fernanda Lima', 'Luna, Bento', '(11) 9XXXX-4410', 'Mensal 1/4', 'hoje', '—'],
      ['Rafael Duarte', 'Bob', '(11) 9XXXX-7731', 'Quinzenal 2/4', 'hoje', 'R$ 480,00', true],
      ['Júlia Martins', 'Amora', '(11) 9XXXX-2290', 'termina hoje', 'hoje', '—'],
      ['Marcos Pereira', 'Fred', '(11) 9XXXX-8812', '', 'hoje', 'R$ 75,00'],
      ['Beatriz Rocha', 'Nina', '(11) 9XXXX-3307', 'Mensal 3/4', 'hoje', '—'],
      ['Carla Nogueira Albuquerque', 'Mel, Pipoca, Tobias', '(11) 9XXXX-6654', '', 'hoje', 'R$ 410,00', true],
      ['Lucas Andrade', 'Paçoca', '(11) 9XXXX-1198', '', 'hoje', 'R$ 55,00'],
      ['Paulo Henrique', 'Zeus', '(11) 9XXXX-5023', 'Mensal 4/4', 'hoje', '—'],
      ['Sérgio Alves', 'Kiara', '(11) 9XXXX-0417', 'pausado', '17/10', 'R$ 300,00'],
      ['Helena Prado', 'Mingau (gato)', '—', '', '24/10', 'R$ 450,00'],
      ['Gustavo e Clara Mendes', 'Rex, Pandora', '(11) 9XXXX-9930', 'Mensal 2/4', '28/10', '—'],
      ['Tereza Oliveira', 'Biscoito', '(11) 3XXX-2211', '', '02/09', '—'],
      ['Igor Tavares', 'Nescau', '(11) 9XXXX-6020', '', '14/06', '—']
    ].map(([name, pets, phone, plan, last, balance, checked]) => ({
      name, pets, phone, plan: plan || 'avulso', last, balance, checked: !!checked,
      rowStyle: 'display: grid; grid-template-columns: 44px 2fr 1.6fr 1.3fr 1.2fr 0.9fr 0.9fr; gap: 12px; padding: 0 24px; height: 40px; align-items: center; border-bottom: 1px solid #EFEFEA; ' + (checked ? 'background: #F4F4F1;' : ''),
      planStyle: plan === 'termina hoje' ? 'color: #9A4A00; font-weight: 500' : plan ? 'color: #3A3A36' : 'color: #8A8A84',
      balStyle: 'font-family: \'IBM Plex Mono\', monospace; font-size: 13px; text-align: right; ' + (balance === '—' ? 'color: #A0A09A' : 'color: #B3261E')
    }));
    return { groups, filters, rows };
  }
}
</script>
</body>
</html>

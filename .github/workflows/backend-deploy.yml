name: backend-deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/backend:${{ github.sha }} \
            -f apps/backend/Dockerfile .

      - name: Push image
        run: |
          docker push \
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/backend:${{ github.sha }}

      - name: Deploy backend
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.BACKEND_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/backend:${{ github.sha }}
          env_vars_update_strategy: merge
          env_vars: |-
            SPRING_PROFILES_ACTIVE=prod
            APP_CORS_ALLOWED_ORIGINS=${{ vars.APP_CORS_ALLOWED_ORIGINS }}
            SPRING_DATASOURCE_URL=jdbc:postgresql://${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
            SPRING_DATASOURCE_USERNAME=${{ vars.DB_USER }}
            MAIL_HOST=${{ vars.MAIL_HOST }}
            APP_PASSWORD_RESET_URL_BASE=${{ vars.APP_PASSWORD_RESET_URL_BASE }}
            APP_NOTIFICATION_MAIL_FROM_ADDRESS=${{ vars.APP_NOTIFICATION_MAIL_FROM_ADDRESS }}
          secrets_update_strategy: merge
          secrets: |-
            APP_SECURITY_JWT_SECRET=app-security-jwt-secret:latest
            SPRING_DATASOURCE_PASSWORD=db-password:latest
          flags: >-
            --allow-unauthenticated